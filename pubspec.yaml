name: bigtext
description: "Full-screen text display app for airport pickups, business signage, and presentations."
publish_to: 'none'
version: 0.0.13+13

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  google_fonts: ^6.2.0
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0
  image_picker: ^1.1.0
  package_info_plus: ^8.0.0
  timeago: ^3.7.0
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^8.0.0
  app_tracking_transparency: ^2.0.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/